name: Build GhostControl DS4 Auto-Reconnect Payload
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_payload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y clang-18 lld-18 make git xxd

      - name: Clone ps5-payload-sdk to parent dir
        run: git clone --depth=1 https://github.com/ps5-payload-dev/sdk ../ps5-payload-sdk

      - name: Set SDK env
        run: echo "PS5_PAYLOAD_SDK=$PWD/../ps5-payload-sdk" >> $GITHUB_ENV

      - name: Compile payload
        run: |
          make clean
          make all

      - name: Upload elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ds4-reconnect-elf
          path: build/*.elf
