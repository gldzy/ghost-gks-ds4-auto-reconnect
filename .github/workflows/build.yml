name: Build GhostControl DS4 Auto-Reconnect Payload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Install PS5 build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make git cmake

      - name: Set up PS5SDK
        uses: ps5dev/setup-ps5sdk@v1
        with:
          ps5sdk-version: latest

      - name: Compile payload
        run: |
          make clean
          make all

      - name: Upload compiled ELF
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ds4-reconnect-elf
          path: build/*.elf
