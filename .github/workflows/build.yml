name: Build GhostControl DS4 Auto-Reconnect Payload
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_payload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix CRLF line endings
        run: sed -i 's/\r$//' ./build_correction.sh

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y clang-18 lld-18 make git xxd

      - name: Clone ps5-payload-sdk
        run: git clone --depth=1 https://github.com/ps5-payload-dev/sdk /tmp/ps5-sdk-src

      - name: Build and install SDK
        run: |
          cd /tmp/ps5-sdk-src
          make
          sudo make DESTDIR=/opt/ps5-payload-sdk install

      - name: Set SDK env
        run: echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Build payload
        run: |
          chmod +x ./build_correction.sh
          ./build_correction.sh
          echo "===== After build file list ====="
          ls -laR

      - name: Upload elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ds4-reconnect-elf
          path: |
            *.elf
            build/*.elf
            out/*.elf
