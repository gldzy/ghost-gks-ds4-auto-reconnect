name: Build GhostControl Custom
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git clang-18 lld-18 make xxd
      - name: Clone PS5 payload SDK
        run: git clone --depth=1 https://github.com/ps5-payload-dev/sdk.git /opt/ps5-payload-sdk
      - name: Compile payload
        run: make clean all
      - name: Upload elf
        uses: actions/upload-artifact@v4
        with:
          name: ghostcontrol-custom
          path: *.elf
