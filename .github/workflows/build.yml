name: Build GhostControl DS4 Auto-Reconnect Payload
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_payload:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: make git mingw-w64-clang-x86_64-clang

      - name: Fix script path & CRLF
        run: |
          sed -i 's|/c/msys64/clang64/bin/clang.exe|clang|g' ./build_correction.sh
          sed -i 's/\r$//' ./build_correction.sh
          chmod +x ./build_correction.sh

      - name: Run build script
        run: |
          ./build_correction.sh
          ls -laR

      - name: Upload elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ds4-reconnect-elf
          path: |
            *.elf
            build/*.elf
            out/*.elf
          if-no-files-found: error
