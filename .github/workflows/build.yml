name: Build Payload
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true

      - name: Install aarch64 clang
        run: pacman -S --needed mingw-w64-clang-aarch64-clang

      - name: Fix script CRLF
        run: sed -i 's/\r$//' build_correction.sh

      - name: Run build script
        run: ./build_correction.sh

      - name: Upload elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-gamesir
          path: ghost_gamesir.elf
