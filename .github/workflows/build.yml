name: Build GhostControl DS4 Auto-Reconnect Payload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make git cmake wget unzip

      - name: Download and setup PS5SDK
        run: |
          git clone --depth=1 https://github.com/ps5dev/ps5sdk.git ~/ps5sdk
          echo "PS5SDK=$HOME/ps5sdk" >> $GITHUB_ENV

      - name: Compile payload
        run: |
          make clean
          make all

      - name: Upload compiled ELF
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ds4-reconnect-elf
          path: build/*.elf
